name: Lab 02 - Advanced Triggers

on:
  push:
    branches:
      - prod
    paths:
      - .github/workflows/lab02.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Choose an environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod

jobs:
  show-event:
    runs-on: ubuntu-latest
    steps:
      - name: Show event details
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_ENV: ${{ inputs.environment }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Environment: ${SELECTED_ENV:-not selected}"
